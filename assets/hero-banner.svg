<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#081021" />
      <stop offset="100%" stop-color="#040612" />
    </linearGradient>

    <!-- Hologram Gradient -->
    <linearGradient id="holo-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations for Cyberpunk Feel */
    @keyframes rain-fall {
      0% { transform: translateY(-50px) translateX(20px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(400px) translateX(-40px); opacity: 0; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      41% { opacity: 1; }
      42% { opacity: 0.2; }
      43% { opacity: 1; }
      80% { opacity: 1; }
      81% { opacity: 0.5; }
      82% { opacity: 1; }
    }
    @keyframes typing {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes holo-spin {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
    @keyframes code-scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50px); }
    }

    .rain { animation: rain-fall 1.5s linear infinite; stroke: #00F2FE; stroke-width: 1; stroke-linecap: round; }
    .rain:nth-child(2) { animation-delay: 0.2s; animation-duration: 1.2s; }
    .rain:nth-child(3) { animation-delay: 0.5s; animation-duration: 1.7s; }
    .rain:nth-child(4) { animation-delay: 0.8s; animation-duration: 1.4s; }
    .rain:nth-child(5) { animation-delay: 1.1s; animation-duration: 1.6s; }
    .rain:nth-child(6) { animation-delay: 1.5s; animation-duration: 1.3s; }
    .rain:nth-child(7) { animation-delay: 1.9s; animation-duration: 1.8s; }

    .flicker { animation: flicker 4s infinite; }
    .cursor { animation: typing 1s infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .code-block { animation: code-scroll 8s linear infinite; }
    
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1000" height="400" fill="url(#cyber-bg)" />

  <!-- City Skyline / Window View (Background) -->
  <g opacity="0.3">
    <!-- Buildings -->
    <rect x="50" y="200" width="80" height="200" fill="#0A1526" />
    <rect x="150" y="150" width="60" height="250" fill="#0A1526" />
    <rect x="230" y="220" width="100" height="180" fill="#0A1526" />
    <rect x="350" y="100" width="70" height="300" fill="#0A1526" />
    <rect x="440" y="180" width="120" height="220" fill="#0A1526" />
    <rect x="580" y="130" width="90" height="270" fill="#0A1526" />
    <rect x="700" y="250" width="110" height="150" fill="#0A1526" />
    <rect x="830" y="170" width="80" height="230" fill="#0A1526" />

    <!-- Neon Windows -->
    <g fill="#00F2FE" opacity="0.6">
      <rect x="60" y="220" width="5" height="10" />
      <rect x="80" y="250" width="5" height="10" />
      <rect x="60" y="280" width="5" height="10" />
      <rect x="160" y="170" width="5" height="10" />
      <rect x="180" y="200" width="5" height="10" />
      <rect x="370" y="120" width="5" height="10" />
      <rect x="370" y="150" width="5" height="10" />
      <rect x="600" y="150" width="5" height="10" />
      <rect x="620" y="190" width="5" height="10" />
      <rect x="850" y="190" width="5" height="10" />
    </g>
    <g fill="#FF007F" opacity="0.6">
      <rect x="250" y="240" width="5" height="10" />
      <rect x="280" y="270" width="5" height="10" />
      <rect x="460" y="210" width="5" height="10" />
      <rect x="490" y="250" width="5" height="10" />
      <rect x="720" y="270" width="5" height="10" />
      <rect x="750" y="300" width="5" height="10" />
    </g>
  </g>

  <!-- Digital Rain / Rain outside window -->
  <g class="rain-group" opacity="0.4">
    <line class="rain" x1="100" y1="0" x2="80" y2="20" />
    <line class="rain" x1="250" y1="0" x2="230" y2="20" />
    <line class="rain" x1="400" y1="0" x2="380" y2="20" />
    <line class="rain" x1="550" y1="0" x2="530" y2="20" />
    <line class="rain" x1="700" y1="0" x2="680" y2="20" />
    <line class="rain" x1="850" y1="0" x2="830" y2="20" />
    <line class="rain" x1="950" y1="0" x2="930" y2="20" />
  </g>

  <!-- Cyberpunk Desk / Workstation -->
  <path d="M 0,350 L 1000,350 L 1000,400 L 0,400 Z" fill="#0D1117" stroke="#00F2FE" stroke-width="1" />
  <!-- Glowing edge of desk -->
  <line x1="0" y1="350" x2="1000" y2="350" stroke="#FF007F" stroke-width="2" filter="url(#glow-pink)" />
  <line x1="0" y1="353" x2="1000" y2="353" stroke="#00F2FE" stroke-width="1" opacity="0.5" />

  <!-- 3D Holographic Keyboard -->
  <g transform="translate(350, 360) scale(1, 0.4) rotate(5)" opacity="0.8">
    <rect width="300" height="80" rx="5" fill="#161B22" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Keyboard Grid Lines (Keys) -->
    <g stroke="#00F2FE" stroke-width="1" opacity="0.5">
      <!-- Horizontals -->
      <line x1="10" y1="20" x2="290" y2="20" />
      <line x1="10" y1="40" x2="290" y2="40" />
      <line x1="10" y1="60" x2="290" y2="60" />
      <!-- Verticals -->
      <line x1="30" y1="10" x2="30" y2="70" />
      <line x1="60" y1="10" x2="60" y2="70" />
      <line x1="90" y1="10" x2="90" y2="70" />
      <line x1="120" y1="10" x2="120" y2="70" />
      <line x1="150" y1="10" x2="150" y2="70" />
      <line x1="180" y1="10" x2="180" y2="70" />
      <line x1="210" y1="10" x2="210" y2="70" />
      <line x1="240" y1="10" x2="240" y2="70" />
      <line x1="270" y1="10" x2="270" y2="70" />
    </g>
  </g>

  <!-- Left Monitor (Vertical/Coding) -->
  <g transform="translate(150, 100) rotate(-10)" class="flicker">
    <!-- Stand -->
    <rect x="70" y="200" width="10" height="60" fill="#161B22" />
    <!-- Screen -->
    <rect width="150" height="200" rx="5" fill="#0D1117" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Screen Content (Code) -->
    <g class="font-mono" font-size="6" fill="#00FFCC">
      <clipPath id="left-screen">
        <rect x="5" y="5" width="140" height="190" />
      </clipPath>
      <g clip-path="url(#left-screen)">
        <g class="code-block" transform="translate(10, 20)">
          <text y="0" fill="#FF007F">import</text> <text x="25" y="0">sys, os</text>
          <text y="10" fill="#FF007F">from</text> <text x="20" y="10">neural_core</text> <text x="60" y="10" fill="#FF007F">import</text> <text x="85" y="10">AI</text>
          <text y="25" fill="#00F2FE">def</text> <text x="20" y="25" fill="#FFF">init_system</text><text x="60" y="25">():</text>
          <text x="10" y="35">sys.boot(mode=</text><text x="60" y="35" fill="#FF007F">"CYBER"</text><text x="85" y="35">)</text>
          <text x="10" y="45">load_modules(</text><text x="50" y="45" fill="#00FFCC">"AI_ASSIST"</text><text x="85" y="45">)</text>
          <text x="10" y="55" fill="#00F2FE">return</text> <text x="35" y="55">True</text>
          
          <text y="70" fill="#7F00FF"># Training loop</text>
          <text y="80" fill="#00F2FE">while</text> <text x="25" y="80">True:</text>
          <text x="10" y="90">data = stream.fetch()</text>
          <text x="10" y="100">model.train(data)</text>
          
          <text y="120" fill="#FF007F">class</text> <text x="25" y="120" fill="#FFF">CyberCat</text><text x="55" y="120">(</text><text x="60" y="120">Entity</text><text x="80" y="120">):</text>
          <text x="10" y="130" fill="#00F2FE">def</text> <text x="25" y="130" fill="#FFF">meow</text><text x="40" y="130">(self):</text>
          <text x="20" y="140">print(</text><text x="45" y="140" fill="#00FFCC">"M30W.exe"</text><text x="80" y="140">)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Main Center Monitor (Ultrawide) -->
  <g transform="translate(320, 80)">
    <!-- Stand -->
    <path d="M 170,220 L 190,220 L 200,280 L 160,280 Z" fill="#161B22" />
    <path d="M 120,270 L 240,270 L 250,280 L 110,280 Z" fill="#0D1117" stroke="#FF007F" stroke-width="1" />
    
    <!-- Screen -->
    <rect width="360" height="220" rx="8" fill="#0D1117" stroke="#FF007F" stroke-width="2" filter="url(#glow-pink)" />
    <!-- Screen Content (Dashboard) -->
    <g font-family="'Fira Code', monospace">
      <!-- Header -->
      <rect x="0" y="0" width="360" height="25" fill="#FF007F" opacity="0.2" rx="8" />
      <text x="10" y="17" fill="#FF007F" font-size="10" font-weight="bold">SYSTEM ARCHITECTURE v9.4 // ALOK_MAINFRAME</text>
      
      <!-- Network Graph -->
      <g stroke="#00F2FE" stroke-width="1" transform="translate(30, 60)">
        <circle cx="50" cy="50" r="15" fill="#0D1117" stroke="#00F2FE" />
        <circle cx="120" cy="20" r="10" fill="#0D1117" stroke="#00FFCC" />
        <circle cx="120" cy="80" r="10" fill="#0D1117" stroke="#FF007F" />
        <circle cx="200" cy="50" r="20" fill="#0D1117" stroke="#7F00FF" />
        <circle cx="280" cy="50" r="12" fill="#0D1117" stroke="#00F2FE" />
        
        <line x1="65" y1="50" x2="110" y2="25" />
        <line x1="65" y1="50" x2="110" y2="75" />
        <line x1="130" y1="20" x2="182" y2="42" />
        <line x1="130" y1="80" x2="182" y2="58" />
        <line x1="220" y1="50" x2="268" y2="50" />
        
        <!-- Glowing Data Packets -->
        <circle cx="85" cy="38" r="2" fill="#FFFFFF" filter="url(#glow-cyan)" />
        <circle cx="155" cy="30" r="2" fill="#FFFFFF" filter="url(#glow-pink)" />
        <circle cx="240" cy="50" r="2" fill="#FFFFFF" filter="url(#glow-cyan)" />
      </g>
      
      <!-- HUD Metrics -->
      <g font-size="8" fill="#94A3B8" transform="translate(20, 180)">
        <text y="0">CPU: <tspan fill="#00FFCC">34%</tspan> [||||      ]</text>
        <text y="15">MEM: <tspan fill="#FF007F">82%</tspan> [||||||||  ]</text>
        <text y="30">NET: <tspan fill="#00F2FE">1.2 TB/s</tspan> UPLINK ACTIVE</text>
      </g>
      
      <g font-size="8" fill="#94A3B8" transform="translate(150, 180)">
        <text y="0">MODELS LOADED: <tspan fill="#00FFCC">4</tspan></text>
        <text y="15">INFERENCE LATENCY: <tspan fill="#00F2FE">12ms</tspan></text>
        <text y="30">THREAT DETECTED: <tspan fill="#FF007F">0</tspan></text>
      </g>
    </g>
  </g>

  <!-- Right Monitor (Terminal / Logs) -->
  <g transform="translate(700, 110) rotate(10)">
    <!-- Stand -->
    <rect x="70" y="180" width="10" height="60" fill="#161B22" />
    <!-- Screen -->
    <rect width="150" height="180" rx="5" fill="#0D1117" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Screen Content (Terminal) -->
    <g class="font-mono" font-size="6" fill="#00F2FE">
      <clipPath id="right-screen">
        <rect x="5" y="5" width="140" height="170" />
      </clipPath>
      <g clip-path="url(#right-screen)">
        <text x="10" y="20" fill="#7F00FF">alok@nexus ~ $</text> <text x="65" y="20" fill="#FFF">./deploy.sh</text>
        <text x="10" y="30">[INFO] Building containers...</text>
        <text x="10" y="40">[INFO] Starting Redis cache...</text>
        <text x="10" y="50" fill="#00FFCC">[OK]   Database connected</text>
        <text x="10" y="60">[INFO] Initializing ML models</text>
        <text x="10" y="70" fill="#00FFCC">[OK]   XGBoost loaded (14ms)</text>
        <text x="10" y="80">[INFO] Spinning up API nodes</text>
        <text x="10" y="90">Node 1: Online</text>
        <text x="10" y="100">Node 2: Online</text>
        <text x="10" y="110">Node 3: Online</text>
        <text x="10" y="125" fill="#FF007F">[WARN] Unauthorized access</text>
        <text x="10" y="135">[INFO] IP Blocked.</text>
        <text x="10" y="150" fill="#7F00FF">alok@nexus ~ $</text><rect x="65" y="145" width="4" height="6" fill="#00F2FE" class="cursor" />
      </g>
    </g>
  </g>

  <!-- AI Hologram Base -->
  <g transform="translate(850, 330)">
    <ellipse cx="50" cy="10" rx="40" ry="10" fill="#00F2FE" opacity="0.3" filter="url(#heavy-glow)" />
    <ellipse cx="50" cy="10" rx="20" ry="5" fill="#FFFFFF" opacity="0.8" />
    <!-- Holographic Beam -->
    <polygon points="10,10 90,10 60,-80 40,-80" fill="url(#holo-grad)" opacity="0.5" />
    
    <!-- AI Avatar (Floating Geometric Shape) -->
    <g class="float" transform="translate(50, -50)">
      <polygon points="0,-15 15,0 0,15 -15,0" fill="none" stroke="#FFFFFF" stroke-width="2" filter="url(#glow-cyan)" />
      <circle cx="0" cy="0" r="5" fill="#FF007F" filter="url(#glow-pink)" />
      <!-- Orbiting Rings around AI -->
      <path d="M -20,0 A 20,5 0 1,0 20,0 A 20,5 0 1,0 -20,0" fill="none" stroke="#00F2FE" stroke-width="1">
        <!-- Cannot use rotate animation inside SVG smoothly without transform-origin, omitting for safety -->
      </path>
    </g>
  </g>

  <!-- Centerpiece: Professional Neon Cyber Cat sitting on desk -->
  <!-- We place it slightly in front of the center monitor, left aligned -->
  <g transform="translate(220, 240)" class="float">
    <!-- Cat Glow Shadow -->
    <path d="M 20,100 L 40,30 L 60,30 L 80,100 Z" fill="#FF007F" opacity="0.1" filter="url(#heavy-glow)" />
    
    <!-- Cat Body (Wireframe/Neon lines) -->
    <!-- Head -->
    <polygon points="50,40 30,10 40,40 20,60 50,70 80,60 60,40 70,10" fill="#0D1117" stroke="#00F2FE" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow-cyan)" />
    
    <!-- Cyber Visor -->
    <polygon points="30,45 70,45 65,55 35,55" fill="#FF007F" opacity="0.4" stroke="#FF007F" stroke-width="2" filter="url(#glow-pink)" />
    <!-- Scanning Eye -->
    <circle cx="40" cy="50" r="2" fill="#FFFFFF" filter="url(#glow-cyan)" />
    
    <!-- Body Outline -->
    <path d="M 30,70 Q 10,90 20,120 L 80,120 Q 90,90 70,70 Z" fill="#0D1117" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Robotic Arm / Details -->
    <path d="M 40,70 V 120 M 60,70 V 120" fill="none" stroke="#7F00FF" stroke-width="1.5" />
    <path d="M 20,95 H 80" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-dasharray="2 4" />
    
    <!-- Holographic Tail -->
    <path d="M 80,110 Q 120,110 110,70 Q 105,50 120,40" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round" filter="url(#glow-cyan)" />
  </g>

  <!-- Decorative Floating Code Snippets / HUD Elements -->
  <g class="font-mono" font-size="8" fill="#FF007F" opacity="0.6">
    <text x="30" y="50" class="flicker">0x00FFCA</text>
    <text x="30" y="65" class="flicker">INITIALIZING</text>
    <path d="M 30,75 L 80,75 L 90,85" fill="none" stroke="#FF007F" stroke-width="1" />
  </g>

  <g class="font-mono" font-size="8" fill="#00F2FE" opacity="0.6" text-anchor="end">
    <text x="960" y="50" class="flicker">SYS.ON()</text>
    <text x="960" y="65" class="flicker">TARGET: LOCKED</text>
    <path d="M 960,75 L 910,75 L 900,85" fill="none" stroke="#00F2FE" stroke-width="1" />
  </g>

  <!-- Ambient Fore-ground particles -->
  <g fill="#00FFCC" filter="url(#glow-cyan)" opacity="0.7">
    <circle cx="100" cy="300" r="1.5" class="float" />
    <circle cx="850" cy="200" r="1.5" class="float" style="animation-delay: 1s;" />
    <circle cx="450" cy="350" r="2" class="float" style="animation-delay: 2s;" />
  </g>
</svg>
