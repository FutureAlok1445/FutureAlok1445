<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Deep Space/Tech Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <!-- Professional Cyan Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Professional Blue Glow -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Smooth 3D Perspective Rotation */
    @keyframes orbit-1 {
      0% { transform: rotateX(75deg) rotateZ(0deg); }
      100% { transform: rotateX(75deg) rotateZ(360deg); }
    }
    @keyframes orbit-2 {
      0% { transform: rotateX(65deg) rotateY(15deg) rotateZ(360deg); }
      100% { transform: rotateX(65deg) rotateY(15deg) rotateZ(0deg); }
    }
    @keyframes orbit-g {
      0% { transform: rotateX(60deg) rotateY(-20deg) rotateZ(0deg); }
      100% { transform: rotateX(60deg) rotateY(-20deg) rotateZ(360deg); }
    }
    @keyframes core-pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .ring-1 { transform-origin: 400px 125px; animation: orbit-1 12s linear infinite; }
    .ring-2 { transform-origin: 400px 125px; animation: orbit-2 18s linear infinite; }
    .ring-g { transform-origin: 400px 125px; animation: orbit-g 15s linear infinite; }
    
    .core { transform-origin: 400px 125px; animation: core-pulse 4s ease-in-out infinite; }
    .floating-group { animation: float 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="250" rx="8" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Perspective Grid -->
  <g stroke="#38BDF8" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="250" x2="800" y2="250" />
    
    <line x1="400" y1="150" x2="-200" y2="250" />
    <line x1="400" y1="150" x2="100" y2="250" />
    <line x1="400" y1="150" x2="250" y2="250" />
    <line x1="400" y1="150" x2="400" y2="250" />
    <line x1="400" y1="150" x2="550" y2="250" />
    <line x1="400" y1="150" x2="700" y2="250" />
    <line x1="400" y1="150" x2="1000" y2="250" />
  </g>

  <!-- Centerpiece: Professional 3D Geometric Construct -->
  <g class="floating-group">
    
    <!-- Ambient Core Glow -->
    <circle cx="400" cy="125" r="80" fill="#38BDF8" opacity="0.1" filter="url(#glow-blue)" />

    <!-- 3D Orbiting Rings (Data Streams) -->
    <!-- Ring 1 (Outer) -->
    <g class="ring-1">
      <circle cx="400" cy="125" r="160" fill="none" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />
      <circle cx="560" cy="125" r="3" fill="#38BDF8" filter="url(#glow-cyan)" />
      <circle cx="240" cy="125" r="2" fill="#38BDF8" />
    </g>

    <!-- Ring 2 (Inner Tilted) -->
    <g class="ring-2">
      <circle cx="400" cy="125" r="120" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="15 5 2 5" opacity="0.7" />
      <circle cx="400" cy="5" r="4" fill="#38BDF8" filter="url(#glow-cyan)" />
    </g>

    <!-- The "G-Shape" Orbit (As requested by user) -->
    <g class="ring-g">
      <path d="M 400,25 A 100,100 0 1,1 320,65" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#glow-cyan)" />
      <!-- Data Node on G-Orbit -->
      <circle cx="320" cy="65" r="4" fill="#FFFFFF" filter="url(#glow-blue)" />
    </g>

    <!-- Central Core: Sleek Abstract Geometry (representing a highly advanced node) -->
    <g class="core">
      <!-- Hexagonal Base -->
      <polygon points="400,85 435,105 435,145 400,165 365,145 365,105" fill="#02040A" stroke="#38BDF8" stroke-width="2" filter="url(#glow-cyan)" />
      
      <!-- Inner Geometry (Pyramid/Cube projection) -->
      <polygon points="400,85 435,145 365,145" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.7" />
      <polygon points="400,165 435,105 365,105" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.7" />
      <line x1="400" y1="85" x2="400" y2="165" stroke="#38BDF8" stroke-width="1.5" filter="url(#glow-cyan)" />
      
      <!-- Central Bright Node -->
      <circle cx="400" cy="125" r="5" fill="#FFFFFF" filter="url(#glow-blue)" />
    </g>

  </g>

  <!-- Left Side: Professional HUD Data Metrics -->
  <g font-family="monospace" font-size="10" fill="#94A3B8" opacity="0.9">
    <text x="40" y="60">SYSTEM ARCHITECTURE</text>
    <line x1="40" y1="65" x2="160" y2="65" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
    <text x="40" y="85">LATENCY   : <tspan fill="#38BDF8">12ms</tspan></text>
    <text x="40" y="105">NODES     : <tspan fill="#38BDF8">ACTIVE</tspan></text>
    <text x="40" y="125">ROUTING   : <tspan fill="#38BDF8">OPTIMAL</tspan></text>
  </g>

  <!-- Right Side: Professional HUD Data Metrics -->
  <g font-family="monospace" font-size="10" fill="#94A3B8" opacity="0.9" text-anchor="end">
    <text x="760" y="60">NEURAL ENGINE</text>
    <line x1="640" y1="65" x2="760" y2="65" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
    <text x="760" y="85">PREDICTION : <tspan fill="#38BDF8">94.2%</tspan></text>
    <text x="760" y="105">INFERENCE  : <tspan fill="#38BDF8">ONLINE</tspan></text>
    <text x="760" y="125">MODEL      : <tspan fill="#38BDF8">SYNCED</tspan></text>
  </g>

</svg>
