<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070F" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Styling for HUD Text */
    .hud-text {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    
    /* Key blinking for binary */
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .hud-blink {
      animation: blink 2s infinite;
    }

    /* Head rotation/bobbing animation to look 3D */
    @keyframes cat-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    .neon-cat {
      animation: cat-bob 4s ease-in-out infinite;
      transform-origin: 400px 150px;
    }

    /* Grid pulse */
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.12; }
    }
    .cyber-grid {
      animation: grid-pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="300" rx="12" fill="url(#cyber-bg)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Cyber Grid Pattern (Pulsing, Background) -->
  <g class="cyber-grid" stroke="#00F2FE" stroke-width="0.5" opacity="0.08">
    <!-- Grid floor perspective -->
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="275" x2="800" y2="275" />
    
    <line x1="400" y1="170" x2="-200" y2="300" />
    <line x1="400" y1="170" x2="100" y2="300" />
    <line x1="400" y1="170" x2="280" y2="300" />
    <line x1="400" y1="170" x2="400" y2="300" />
    <line x1="400" y1="170" x2="520" y2="300" />
    <line x1="400" y1="170" x2="700" y2="300" />
    <line x1="400" y1="170" x2="1000" y2="300" />
  </g>

  <!-- HUD Corner Brackets (Vibrant Tech Look) -->
  <g stroke="#00FFCC" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 25,45 V 25 H 45" />
    <path d="M 775,45 V 25 H 755" />
    <path d="M 25,255 V 275 H 45" />
    <path d="M 775,255 V 275 H 755" />
  </g>

  <!-- Center Ambient Radial Glow (Behind the Neon Cat) -->
  <circle cx="400" cy="150" r="110" fill="#7F00FF" opacity="0.12" filter="url(#heavy-glow)" />
  <circle cx="400" cy="150" r="70" fill="#00F2FE" opacity="0.08" filter="url(#heavy-glow)" />

  <!-- ==================== ORBITS: BACK LAYER (Behind Cat) ==================== -->
  <!-- Tilted Orbit 1 (Planetary Ring, Back Half) -->
  <g transform="translate(400, 150) rotate(-15) skewX(30) translate(-400, -150)" opacity="0.3">
    <!-- Back half of the circular orbit -->
    <path d="M 220,150 A 180,180 0 0,1 580,150" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- ==================== CENTERPIECE: 3D NEON CAT ==================== -->
  <g class="neon-cat">
    <!-- Outer geometric head shape -->
    <path d="M 350,110 Q 315,150 350,190 Q 400,225 450,190 Q 485,150 450,110 Q 400,105 350,110 Z" 
          fill="#060913" fill-opacity="0.85" stroke="#00F2FE" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow-cyan)" />

    <!-- Left Ear (Outer & Inner) -->
    <path d="M 350,110 L 325,55 L 380,95 Z" fill="#060913" stroke="#00F2FE" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)" />
    <path d="M 352,103 L 334,67 L 374,92 Z" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow-pink)" />
    
    <!-- Right Ear (Outer & Inner) -->
    <path d="M 450,110 L 475,55 L 420,95 Z" fill="#060913" stroke="#00F2FE" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)" />
    <path d="M 448,103 L 466,67 L 426,92 Z" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow-pink)" />

    <!-- Head Stripes (Sleek tech lines) -->
    <path d="M 394,111 V 118 M 400,110 V 119 M 406,111 V 118" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-linecap="round" />

    <!-- Glowing Cyber Visor -->
    <polygon points="342,120 458,120 448,142 352,142" fill="#FF007F" fill-opacity="0.25" stroke="#FF007F" stroke-width="1.8" filter="url(#glow-pink)" />
    <!-- Visor Scanline -->
    <line x1="342" y1="126" x2="458" y2="126" stroke="#FF007F" stroke-width="3" filter="url(#heavy-glow)" />
    <!-- Visor HUD Indicators -->
    <path d="M 347,123 H 351 V 127 M 453,123 H 449 V 127" fill="none" stroke="#00FFCC" stroke-width="1" />
    <circle cx="400" cy="133" r="1.5" fill="#00FFCC" />

    <!-- Nose (Neon Triangle) -->
    <polygon points="397,149 403,149 400,152" fill="#FF007F" filter="url(#glow-pink)" />
    
    <!-- Cute Geometric Mouth -->
    <path d="M 391,157 Q 396,160 400,157 Q 404,160 409,157" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round" />

    <!-- Whiskers (Neon vectors) -->
    <path d="M 330,165 L 295,163 M 332,172 L 297,175" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-cyan)" />
    <path d="M 470,165 L 505,163 M 468,172 L 503,175" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-cyan)" />
  </g>

  <!-- ==================== ORBITS: FRONT LAYER (In Front of Cat) ==================== -->
  
  <!-- Tilted Orbit 1 (Planetary Ring, Front Half) -->
  <g transform="translate(400, 150) rotate(-15) skewX(30) translate(-400, -150)">
    <!-- Front half of the circular orbit -->
    <path d="M 580,150 A 180,180 0 0,1 220,150" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="6 6" filter="url(#glow-cyan)" />
    
    <!-- Invisible full path for animation -->
    <path id="orbit-ring-1" d="M 220,150 A 180,180 0 1,0 580,150 A 180,180 0 1,0 220,150" fill="none" stroke="none" />
    
    <!-- Orbiting Neon Particles -->
    <circle r="4" fill="#00FFCC" filter="url(#heavy-glow)">
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#orbit-ring-1" />
      </animateMotion>
    </circle>
    
    <circle r="3" fill="#FF007F" filter="url(#heavy-glow)">
      <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite">
        <mpath href="#orbit-ring-1" />
      </animateMotion>
    </circle>
  </g>

  <!-- Tilted Orbit 2 (Tilted Opposite Circular Orbit) -->
  <g transform="translate(400, 150) rotate(20) skewX(-20) translate(-400, -150)">
    <path id="orbit-ring-2" d="M 250,150 A 150,150 0 1,0 550,150 A 150,150 0 1,0 250,150" fill="none" stroke="#FF007F" stroke-width="1" stroke-dasharray="4 4" opacity="0.5" />
    
    <!-- Binary numbers orbiting along this ring -->
    <text fill="#00FFCC" font-family="monospace" font-size="11" font-weight="bold" filter="url(#glow-cyan)">
      1
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#orbit-ring-2" />
      </animateMotion>
    </text>
    
    <text fill="#00F2FE" font-family="monospace" font-size="11" font-weight="bold" filter="url(#glow-cyan)">
      0
      <animateMotion dur="6s" begin="3s" repeatCount="indefinite">
        <mpath href="#orbit-ring-2" />
      </animateMotion>
    </text>
  </g>

  <!-- ==================== G-SHAPE ORBIT (Tilted, Looping Orbit) ==================== -->
  <!-- Tilted group containing the G-Shape Path -->
  <g transform="translate(400, 150) skewX(-25) rotate(-10) translate(-400, -150)">
    <!-- Glowing G-Shape Path -->
    <path id="g-shape-orbit" d="M 490,75 A 110,110 0 1,0 510,150 H 440 V 175 H 410" fill="none" stroke="url(#neon-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#heavy-glow)" />
    
    <!-- Orbiting Sparkle following the G-Shape -->
    <circle r="4.5" fill="#FFFFFF" filter="url(#heavy-glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite">
        <mpath href="#g-shape-orbit" />
      </animateMotion>
    </circle>

    <!-- Floating Binary Numbers following the G-Shape -->
    <text fill="#00FFCC" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glow-cyan)">
      1
      <animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite">
        <mpath href="#g-shape-orbit" />
      </animateMotion>
    </text>
    
    <text fill="#FF007F" font-family="monospace" font-size="12" font-weight="bold" filter="url(#glow-pink)">
      0
      <animateMotion dur="4.5s" begin="3s" repeatCount="indefinite">
        <mpath href="#g-shape-orbit" />
      </animateMotion>
    </text>
  </g>

  <!-- ==================== HUD METRICS & DATA PANELS ==================== -->
  <!-- Left Side HUD Data Panel -->
  <g class="hud-text" fill="#6B7280" opacity="0.8">
    <text x="35" y="65">SYS.TYPE: <tspan fill="#00F2FE">AURA.CORE_</tspan></text>
    <text x="35" y="85">STATUS: <tspan fill="#00FFCC">ONLINE</tspan></text>
    <text x="35" y="105">COGNITION: <tspan fill="#FF007F">STABLE</tspan></text>
    <text x="35" y="125" class="hud-blink">KEY_DECRYPT: <tspan fill="#00FFCC">101011011011</tspan></text>
  </g>

  <!-- Right Side HUD Data Panel -->
  <g class="hud-text" fill="#6B7280" opacity="0.8" text-anchor="end">
    <text x="765" y="65">MEOW.DAEMON: <tspan fill="#00FFCC">ACTIVE</tspan></text>
    <text x="765" y="85">ORBITAL.SPD: <tspan fill="#00F2FE">324 M/S</tspan></text>
    <text x="765" y="105">PERSPECTIVE: <tspan fill="#FF007F">3D.PROJ_</tspan></text>
    <text x="765" y="125">SYS.SECURE: <tspan fill="#00FFCC">YES (100%)</tspan></text>
  </g>

  <!-- ==================== BANNER FOOTER PANEL ==================== -->
  <line x1="30" y1="265" x2="770" y2="265" stroke="#1F2937" stroke-width="1" />
  
  <g class="hud-text" fill="#4B5563">
    <text x="35" y="284">⚡ ENERGIZE: <tspan fill="#00FFCC">OVERLOADED</tspan></text>
    <text x="210" y="284">🎯 OBJECTIVE: <tspan fill="#00F2FE">HACK THE PLANET</tspan></text>
    <text x="440" y="284">🐾 ZOOMIES LEVEL: <tspan fill="#FF007F">CRITICAL (3 AM)</tspan></text>
    <text x="765" y="284" text-anchor="end">ALOK KUMAR SAHOO // 2026</text>
  </g>
</svg>
