<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070F" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070F" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Head rotation/bobbing animation to look 3D */
    @keyframes cat-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }
    .neon-cat {
      animation: cat-bob 4s ease-in-out infinite;
      transform-origin: 300px 120px;
    }

    /* Grid pulse */
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.04; }
      50% { opacity: 0.1; }
    }
    .cyber-grid {
      animation: grid-pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="600" height="250" rx="12" fill="url(#cyber-bg)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Cyber Grid Pattern (Pulsing, Background) -->
  <g class="cyber-grid" stroke="#00F2FE" stroke-width="0.5" opacity="0.08">
    <!-- Grid floor perspective -->
    <line x1="0" y1="165" x2="600" y2="165" />
    <line x1="0" y1="185" x2="600" y2="185" />
    <line x1="0" y1="205" x2="600" y2="205" />
    <line x1="0" y1="225" x2="600" y2="225" />
    <line x1="0" y1="242" x2="600" y2="242" />
    
    <line x1="300" y1="140" x2="-200" y2="250" />
    <line x1="300" y1="140" x2="50" y2="250" />
    <line x1="300" y1="140" x2="180" y2="250" />
    <line x1="300" y1="140" x2="300" y2="250" />
    <line x1="300" y1="140" x2="420" y2="250" />
    <line x1="300" y1="140" x2="550" y2="250" />
    <line x1="300" y1="140" x2="800" y2="250" />
  </g>

  <!-- Center Ambient Radial Glow (Behind the Neon Cat) -->
  <circle cx="300" cy="120" r="90" fill="#7F00FF" opacity="0.12" filter="url(#heavy-glow)" />
  <circle cx="300" cy="120" r="60" fill="#00F2FE" opacity="0.08" filter="url(#heavy-glow)" />

  <!-- ==================== ORBITS: BACK LAYER (Behind Cat) ==================== -->
  <!-- Tilted Orbit 1 (Circular Orbit, Back Half) -->
  <g transform="translate(300, 120) rotate(-15) skewX(30) translate(-300, -120)" opacity="0.2">
    <path d="M 120,120 A 180,180 0 0,1 480,120" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- ==================== CENTERPIECE: 3D NEON CAT ==================== -->
  <g class="neon-cat">
    <!-- Outer geometric head shape -->
    <path d="M 250,80 Q 215,120 250,160 Q 300,195 350,160 Q 385,120 350,80 Q 300,75 250,80 Z" 
          fill="#060913" fill-opacity="0.85" stroke="#00F2FE" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow-cyan)" />

    <!-- Left Ear (Outer & Inner) -->
    <path d="M 250,80 L 225,25 L 280,65 Z" fill="#060913" stroke="#00F2FE" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)" />
    <path d="M 252,73 L 234,37 L 274,62 Z" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow-pink)" />
    
    <!-- Right Ear (Outer & Inner) -->
    <path d="M 350,80 L 375,25 L 320,65 Z" fill="#060913" stroke="#00F2FE" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)" />
    <path d="M 348,73 L 366,37 L 326,62 Z" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow-pink)" />

    <!-- Head Stripes (Sleek tech lines) -->
    <path d="M 294,81 V 88 M 300,80 V 89 M 306,81 V 88" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-linecap="round" />

    <!-- Glowing Cyber Visor -->
    <polygon points="242,90 358,90 348,112 252,112" fill="#FF007F" fill-opacity="0.25" stroke="#FF007F" stroke-width="1.8" filter="url(#glow-pink)" />
    <!-- Visor Scanline -->
    <line x1="242" y1="96" x2="358" y2="96" stroke="#FF007F" stroke-width="3" filter="url(#heavy-glow)" />
    <!-- Visor HUD Indicators -->
    <path d="M 247,93 H 251 V 97 M 353,93 H 349 V 97" fill="none" stroke="#00FFCC" stroke-width="1" />
    <circle cx="300" cy="103" r="1.5" fill="#00FFCC" />

    <!-- Nose (Neon Triangle) -->
    <polygon points="297,119 303,119 300,122" fill="#FF007F" filter="url(#glow-pink)" />
    
    <!-- Cute Geometric Mouth -->
    <path d="M 291,127 Q 296,130 300,127 Q 304,130 309,127" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round" />

    <!-- Whiskers (Neon vectors) -->
    <path d="M 230,135 L 195,133 M 232,142 L 197,145" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-cyan)" />
    <path d="M 370,135 L 405,133 M 368,142 L 403,145" fill="none" stroke="#00FFCC" stroke-width="1.5" stroke-linecap="round" filter="url(#glow-cyan)" />
  </g>

  <!-- ==================== ORBITS: FRONT LAYER (In Front of Cat) ==================== -->
  
  <!-- Tilted Orbit 1 (Front Half - Orbiting Tech Text Tags) -->
  <g transform="translate(300, 120) rotate(-15) skewX(30) translate(-300, -120)">
    <!-- Front half of the circular orbit -->
    <path d="M 480,120 A 180,180 0 0,1 120,120" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="6 6" filter="url(#glow-cyan)" />
    
    <!-- Invisible full path for animation -->
    <path id="orbit-ring-1" d="M 120,120 A 180,180 0 1,0 480,120 A 180,180 0 1,0 120,120" fill="none" stroke="none" />
    
    <!-- Orbiting Tech Tags -->
    <text fill="#00FFCC" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow-cyan)" text-anchor="middle">
      React
      <animateMotion dur="7s" repeatCount="indefinite">
        <mpath href="#orbit-ring-1" />
      </animateMotion>
    </text>
    
    <text fill="#FF007F" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow-pink)" text-anchor="middle">
      Node.js
      <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite">
        <mpath href="#orbit-ring-1" />
      </animateMotion>
    </text>
  </g>

  <!-- Tilted Orbit 2 (Tilted Opposite Circular Orbit - Orbiting Tech Text Tags) -->
  <g transform="translate(300, 120) rotate(20) skewX(-20) translate(-300, -120)">
    <path id="orbit-ring-2" d="M 150,120 A 150,150 0 1,0 450,120 A 150,150 0 1,0 150,120" fill="none" stroke="#FF007F" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
    
    <!-- Tech text tags orbiting along this ring -->
    <text fill="#00FFCC" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow-cyan)" text-anchor="middle">
      Python
      <animateMotion dur="8.5s" repeatCount="indefinite">
        <mpath href="#orbit-ring-2" />
      </animateMotion>
    </text>
    
    <text fill="#00F2FE" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow-cyan)" text-anchor="middle">
      Docker
      <animateMotion dur="8.5s" begin="4.25s" repeatCount="indefinite">
        <mpath href="#orbit-ring-2" />
      </animateMotion>
    </text>
  </g>

  <!-- ==================== G-SHAPE ORBIT (Tilted, Looping Orbit) ==================== -->
  <g transform="translate(300, 120) skewX(-25) rotate(-10) translate(-300, -120)">
    <!-- Glowing G-Shape Path -->
    <path id="g-shape-orbit" d="M 390,45 A 110,110 0 1,0 410,120 H 340 V 145 H 310" fill="none" stroke="url(#neon-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#heavy-glow)" />
    
    <!-- Orbiting Tech Tags following the G-Shape -->
    <text fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" filter="url(#heavy-glow)" text-anchor="middle">
      ML
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#g-shape-orbit" />
      </animateMotion>
    </text>
    
    <text fill="#00FFCC" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow-cyan)" text-anchor="middle">
      SQL
      <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite">
        <mpath href="#g-shape-orbit" />
      </animateMotion>
    </text>
  </g>
</svg>
